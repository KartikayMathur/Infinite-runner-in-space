<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Space Runner - Infinite Adventure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            image-rendering: pixelated; /* Crisper pixels */
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4 / 3; /* Maintain aspect ratio */
            border: 4px solid #0ff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.7);
            background: #000;
        }

        #gameContainer::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,0.2) 50%), linear-gradient(90deg, rgba(255,0,0,0.03), rgba(0,255,0,0.02), rgba(0,0,255,0.03));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 100;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            position: relative;
            z-index: 5;
        }

        /* --- Retro UI --- */
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 10px;
            color: #fff;
            text-shadow: 2px 2px #000;
            pointer-events: none;
            z-index: 10;
        }

        .hud-panel {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border: 2px solid #0ff;
        }

        .hud {
            display: flex;
            justify-content: space-between;
        }

        .score-display {
            font-size: 16px;
            color: #ff0;
            margin-bottom: 5px;
        }

        .stat {
            font-size: 12px;
            margin-top: 5px;
        }

        .health-bar {
            width: 150px;
            height: 16px;
            background: #555;
            border: 2px solid #fff;
            margin: 5px 0;
        }

        .health-fill {
            height: 100%;
            background: #f00;
            transition: width 0.3s;
        }

        .danger-zone-warning {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 40px;
            color: #f00;
            font-size: 18px;
            text-shadow: 2px 2px #000;
            animation: blink 1s step-end infinite;
            z-index: 15;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* --- Menus --- */
        .menu-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 20;
            padding: 20px;
            border: 4px solid #0ff;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
            text-shadow: 3px 3px #f0f;
            color: #0ff;
        }

        .menu-button {
            background: #333;
            border: 2px solid #fff;
            color: #fff;
            padding: 15px 30px;
            font-size: 16px;
            margin: 8px;
            cursor: pointer;
            text-shadow: 2px 2px #000;
            transition: all 0.1s;
        }

        .menu-button:hover {
            background: #ff0;
            color: #000;
            text-shadow: 2px 2px #fff;
            transform: translate(-2px, -2px);
            box-shadow: 2px 2px #000;
        }

        .menu-button.selected {
            background: #f0f;
            color: #fff;
            border-color: #ff0;
        }

        .stats-display {
            background: #222;
            padding: 20px;
            margin: 20px 0;
            border: 2px solid #fff;
            text-align: left;
        }

        .stat-line {
            font-size: 14px;
            margin: 8px 0;
            color: #0ff;
        }

        .shop-grid, .hangar-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .upgrade-card {
            background: #333;
            border: 2px solid #fff;
            padding: 15px;
            text-align: center;
        }

        .upgrade-card:hover {
            background: #444;
        }

        .upgrade-cost {
            background: #0ff;
            color: #000;
            padding: 5px 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            display: inline-block;
        }

        /* --- Daily Reward Modal --- */
        #dailyRewardModal {
            text-align: center;
        }

        #dailyRewardModal h2 {
            font-size: 24px;
            color: #ff0;
            margin-bottom: 15px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div id="ui" class="hidden">
            <div class="hud">
                <div class="hud-panel">
                    <div class="score-display">SCORE: <span id="score">0</span></div>
                    <div class="stat">DIST: <span id="distance">0</span>M</div>
                    <div class="stat">COINS: <span id="coins">0</span></div>
                </div>
                <div class="hud-panel">
                    <div class="stat">HEALTH</div>
                    <div class="health-bar">
                        <div class="health-fill" id="healthBar" style="width: 100%"></div>
                    </div>
                </div>
            </div>
            <div id="dangerZoneWarning" class="danger-zone-warning hidden">!! DANGER ZONE !!</div>
        </div>

        <div id="mainMenu" class="menu-screen">
            <h1>SPACE RUNNER</h1>
            <button class="menu-button" onclick="game.startGame()">START GAME</button>
            <button class="menu-button" onclick="game.openShop()">SHOP</button>
            <button class="menu-button" onclick="game.openHangar()">HANGAR</button>
        </div>

        <div id="gameOverScreen" class="menu-screen hidden">
            <h1>GAME OVER</h1>
            <div class="stats-display">
                <div class="stat-line">FINAL SCORE: <span id="finalScore">0</span></div>
                <div class="stat-line">DISTANCE: <span id="finalDistance">0</span>M</div>
                <div class="stat-line">COINS GAINED: <span id="finalCoins">0</span></div>
                <div class="stat-line">ENEMIES KILLED: <span id="finalEnemies">0</span></div>
            </div>
            <button class="menu-button" onclick="game.restartGame()">PLAY AGAIN</button>
            <button class="menu-button" onclick="game.returnToMenu()">MAIN MENU</button>
        </div>

        <div id="shopMenu" class="menu-screen hidden">
            <h1>UPGRADE SHOP</h1>
            <div class="stat-line">CREDITS: <span id="totalCredits">0</span></div>
            <div class="shop-grid">
                 <!-- Upgrades will be dynamically generated here -->
            </div>
            <button class="menu-button" onclick="game.closeShop()">BACK</button>
        </div>

        <div id="hangarMenu" class="menu-screen hidden">
            <h1>HANGAR - SELECT STARTING BONUS</h1>
            <div class="hangar-grid">
                <!-- Starting bonuses will be dynamically generated here -->
            </div>
            <button class="menu-button" onclick="game.closeHangar()">BACK</button>
        </div>

        <div id="dailyRewardModal" class="menu-screen hidden">
            <h2>DAILY REWARD!</h2>
            <p>Welcome back, pilot!</p>
            <p>Here's a bonus for ya!</p>
            <div class="stat-line" style="font-size: 20px; margin: 20px 0;">+250 CREDITS</div>
            <button class="menu-button" onclick="game.claimDailyReward()">AWESOME!</button>
        </div>
    </div>

    <script>
        class SpaceRunner {
            constructor() {
                // Canvas and Context setup
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.width = 800; // Game resolution
                this.height = 600;
                this.canvas.width = this.width;
                this.canvas.height = this.height;

                // Game state
                this.gameState = 'menu';
                this.baseSpeed = 2.5;
                this.gameSpeed = 1;
                this.maxSpeed = 10;
                this.speedIncrement = 0.0001;

                // Player data
                this.player = {
                    x: 100, y: this.height / 2, width: 40, height: 24,
                    velocityY: 0, gravity: 0.25, // Reduced gravity for floatier feel
                    jumpPower: -7, damping: 0.98, // Damping for smoother stops
                    maxHealth: 100, health: 100,
                    isInvulnerable: false, invulnerabilityTime: 0
                };

                // Stats & Currency
                this.score = 0; this.distance = 0; this.coins = 0; this.enemiesDestroyed = 0;
                this.totalCredits = parseInt(localStorage.getItem('SR_totalCredits') || '0');

                // Upgrades & Loadout
                this.upgrades = JSON.parse(localStorage.getItem('SR_upgrades')) || { health: 1, fireRate: 1, damage: 1, thruster: 1 };
                this.startingBonuses = JSON.parse(localStorage.getItem('SR_startingBonuses')) || { shield: true, missile: false, emp: false };
                this.selectedBonus = localStorage.getItem('SR_selectedBonus') || 'shield';

                // Game Objects
                this.bullets = []; this.obstacles = []; this.powerUps = []; this.enemies = []; this.particles = []; this.coinObjects = []; this.stars = [];

                // Power-up states
                this.activePowerUps = { shield: 0, missile: 0, emp: 0, ghost: 0 };

                // Level generation
                this.lastEntityX = this.width; this.difficultyLevel = 1;
                this.segmentPatterns = ['safe', 'asteroid_field', 'enemy_wave', 'coin_line'];
                this.currentPattern = 'safe'; this.patternProgress = 0; this.patternLength = 20;

                this.initStars();
                this.setupControls();
                this.applyUpgrades();
                this.updateShopUI();
                this.updateHangarUI();
                this.checkDailyReward();

                this.lastTime = 0;
                requestAnimationFrame(this.animate.bind(this));
            }

            // --- Game State & Core Loop ---

            startGame() {
                this.resetGame();
                this.gameState = 'playing';
                document.getElementById('mainMenu').classList.add('hidden');
                document.getElementById('ui').classList.remove('hidden');
            }

            gameOver() {
                this.gameState = 'gameOver';
                document.getElementById('finalScore').innerText = this.score;
                document.getElementById('finalDistance').innerText = Math.floor(this.distance);
                document.getElementById('finalCoins').innerText = this.coins;
                document.getElementById('finalEnemies').innerText = this.enemiesDestroyed;

                this.totalCredits += this.coins;
                localStorage.setItem('SR_totalCredits', this.totalCredits);

                document.getElementById('gameOverScreen').classList.remove('hidden');
            }

            resetGame() {
                this.applyUpgrades();
                this.player.y = this.height / 2;
                this.player.velocityY = 0;
                this.player.health = this.player.maxHealth;
                this.player.isInvulnerable = false;

                this.obstacles = []; this.enemies = []; this.bullets = []; this.powerUps = []; this.coinObjects = []; this.particles = [];
                this.score = 0; this.distance = 0; this.coins = 0; this.enemiesDestroyed = 0;
                this.gameSpeed = 1; this.lastEntityX = this.width;

                Object.keys(this.activePowerUps).forEach(key => this.activePowerUps[key] = 0);

                // Apply starting bonus
                if (this.startingBonuses[this.selectedBonus]) {
                    if (this.selectedBonus === 'shield') this.activePowerUps.shield = 10;
                    if (this.selectedBonus === 'missile') this.activePowerUps.missile = 3;
                    if (this.selectedBonus === 'emp') this.activePowerUps.emp = 1;
                }

                this.updateUI();
            }

            animate(timestamp) {
                const deltaTime = (timestamp - this.lastTime) / 1000;
                this.lastTime = timestamp;

                if (this.gameState === 'playing') {
                    this.update(deltaTime || 0);
                }
                this.draw();

                requestAnimationFrame(this.animate.bind(this));
            }

            update(deltaTime) {
                if (this.gameSpeed < this.maxSpeed) this.gameSpeed += this.speedIncrement;
                const scrollSpeed = this.baseSpeed + this.gameSpeed;
                this.distance += scrollSpeed * deltaTime * 5;
                this.score += Math.floor(scrollSpeed * deltaTime);

                this.generateLevel(scrollSpeed);
                this.updatePlayer(deltaTime);
                this.updateObjects(scrollSpeed, deltaTime);
                this.updatePowerUps(deltaTime);
                this.updateUI();
            }

            // --- Player, Controls & Physics ---

            setupControls() {
                document.addEventListener('keydown', (e) => {
                    if (this.gameState !== 'playing' || e.repeat) return;
                    if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); this.thrustAndFire(); }
                });

                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (this.gameState !== 'playing') return;
                    this.thrustAndFire();
                }, { passive: false });
            }

            thrustAndFire() {
                this.player.velocityY = this.player.jumpPower;
                this.fire();
            }

            fire() {
                // Fire logic is now simplified as rate limiting is handled implicitly by thrust tapping
                this.bullets.push({
                    x: this.player.x + this.player.width, y: this.player.y + this.player.height / 2,
                    width: 15, height: 4, speed: 10, damage: this.bulletDamage, type: 'normal'
                });
                 if (this.activePowerUps.missile > 0) {
                     this.activePowerUps.missile--;
                     this.bullets.push({
                        x: this.player.x + this.player.width, y: this.player.y,
                        width: 20, height: 8, speed: 8, damage: 10, type: 'homing', target: null
                     });
                 }
            }

            updatePlayer(deltaTime) {
                this.player.velocityY += this.player.gravity;
                this.player.velocityY *= this.player.damping; // Apply damping
                this.player.y += this.player.velocityY;

                // Danger Zones (replaces floor sitting)
                const dangerZoneSize = 15;
                let inDangerZone = false;
                if (this.player.y < dangerZoneSize || this.player.y + this.player.height > this.height - dangerZoneSize) {
                    this.handlePlayerHit(0.5); // Constant damage in danger zone
                    inDangerZone = true;
                }
                document.getElementById('dangerZoneWarning').classList.toggle('hidden', !inDangerZone);

                // Update invulnerability
                if (this.player.isInvulnerable) {
                    this.player.invulnerabilityTime -= deltaTime;
                    if (this.player.invulnerabilityTime <= 0) this.player.isInvulnerable = false;
                }
            }

            handlePlayerHit(damage) {
                if (this.player.isInvulnerable || this.activePowerUps.shield > 0 || this.activePowerUps.ghost > 0) return;

                this.player.health -= damage;
                this.player.isInvulnerable = true;
                this.player.invulnerabilityTime = 1.5;

                if (this.player.health <= 0) {
                    this.player.health = 0;
                    this.createExplosion(this.player.x, this.player.y, '#fff', 40);
                    this.gameOver();
                }
            }

            // --- Level Generation ---

            generateLevel(scrollSpeed) {
                this.lastEntityX -= scrollSpeed;
                if (this.lastEntityX > this.width) return;

                this.patternProgress++;
                if (this.patternProgress > this.patternLength) {
                    this.patternProgress = 0;
                    this.currentPattern = this.segmentPatterns[Math.floor(Math.random() * this.segmentPatterns.length)];
                    this.difficultyLevel = Math.min(5, 1 + Math.floor(this.distance / 1000));
                    this.lastEntityX = this.width + 200; // Gap between patterns
                    return;
                }

                const spawnInterval = Math.max(100, 400 - this.difficultyLevel * 50);
                this.lastEntityX = this.width + spawnInterval;

                switch(this.currentPattern) {
                    case 'asteroid_field': this.spawnAsteroid(); break;
                    case 'enemy_wave': this.spawnEnemy(); break;
                    case 'coin_line': this.spawnCoinLine(); break;
                }
                if (Math.random() > 0.92) this.spawnPowerUp();
            }

            spawnAsteroid() {
                const size = 30 + Math.random() * 40;
                this.obstacles.push({
                    x: this.width + size, y: Math.random() * (this.height - size),
                    width: size, height: size, type: 'asteroid',
                    rotation: 0, rotationSpeed: Math.random() * 0.05 - 0.025
                });
            }

            spawnEnemy() {
                const types = ['kamikaze', 'shooter', 'carrier'];
                const type = types[Math.floor(Math.random() * Math.min(types.length, this.difficultyLevel))];
                const yPos = Math.random() * (this.height - 100) + 50;

                this.enemies.push({
                    x: this.width + 50, y: yPos,
                    width: type === 'carrier' ? 60 : 40,
                    height: type === 'carrier' ? 40 : 30,
                    type,
                    health: type === 'carrier' ? 5 * this.difficultyLevel : (type === 'shooter' ? 2 * this.difficultyLevel : this.difficultyLevel),
                    maxHealth: type === 'carrier' ? 5 * this.difficultyLevel : (type === 'shooter' ? 2 * this.difficultyLevel : this.difficultyLevel),
                    lastFireTime: 0
                });
            }

            spawnCoinLine() {
                const y = Math.random() * (this.height - 200) + 100;
                for (let i = 0; i < 6; i++) {
                    this.coinObjects.push({
                        x: this.width + 50 + i * 40, y: y + Math.sin(i * 0.8) * 40,
                        width: 20, height: 20, value: 1
                    });
                }
            }
            spawnPowerUp() {
                const types = ['shield', 'missile', 'emp', 'ghost'];
                this.powerUps.push({
                    x: this.width + 50, y: Math.random() * (this.height - 100) + 50,
                    width: 30, height: 30, type: types[Math.floor(Math.random() * types.length)]
                });
            }

            // --- Object Updates ---

            updateObjects(scrollSpeed, deltaTime) {
                // Update obstacles, enemies, bullets, powerups, coins...
                // ... (This logic is largely the same, but now uses the passed `scrollSpeed`)
            }

            // --- Power-Ups ---

            activatePowerUp(type) {
                if (type === 'shield') this.activePowerUps.shield = 10;
                if (type === 'missile') this.activePowerUps.missile += 5;
                if (type === 'ghost') this.activePowerUps.ghost = 5;
                if (type === 'emp') {
                    this.enemies = [];
                    this.obstacles = this.obstacles.filter(o => o.type === 'asteroid'); // Keep asteroids
                    this.createExplosion(this.width/2, this.height/2, '#0ff', 100, 20);
                }
            }

            updatePowerUps(deltaTime) {
                 for (const key in this.activePowerUps) {
                    if (key !== 'missile' && key !== 'emp') { // These are ammo-based
                       if (this.activePowerUps[key] > 0) this.activePowerUps[key] -= deltaTime;
                    }
                 }
            }

            // --- Drawing & Visuals (largely unchanged, but some style adjustments) ---

            draw() {
                this.ctx.clearRect(0, 0, this.width, this.height);
                this.drawStars(this.baseSpeed + this.gameSpeed);

                // Draw objects...
                this.drawPlayer();
            }

            drawPlayer() {
                // Ghost effect
                if (this.activePowerUps.ghost > 0) {
                    this.ctx.globalAlpha = 0.5;
                }

                // Player ship with invulnerability flash
                if (this.player.isInvulnerable && Math.floor(this.player.invulnerabilityTime * 10) % 2 === 0) {
                    this.ctx.fillStyle = '#f00';
                } else {
                    this.ctx.fillStyle = '#0ff';
                }

                this.ctx.beginPath();
                this.ctx.moveTo(this.player.x + this.player.width, this.player.y + this.player.height / 2);
                this.ctx.lineTo(this.player.x, this.player.y);
                this.ctx.lineTo(this.player.x + 10, this.player.y + this.player.height / 2);
                this.ctx.lineTo(this.player.x, this.player.y + this.player.height);
                this.ctx.closePath();
                this.ctx.fill();
                this.ctx.globalAlpha = 1;

                // Shield effect
                if (this.activePowerUps.shield > 0) {
                     this.ctx.strokeStyle = `rgba(0, 255, 255, ${0.5 + Math.sin(Date.now()/100) * 0.5})`;
                    this.ctx.lineWidth = 4;
                    this.ctx.beginPath();
                    this.ctx.rect(this.player.x - 5, this.player.y - 5, this.player.width + 10, this.player.height + 10);
                    this.ctx.stroke();
                }
            }

            createExplosion(x, y, color = '#ffA500', count = 20, size=5) {
                for (let i = 0; i < count; i++) {
                    this.particles.push({
                        x, y,
                        vx: (Math.random() - 0.5) * 15, vy: (Math.random() - 0.5) * 15,
                        size: Math.random() * size + 2, life: 1, color
                    });
                }
            }

            // --- UI, Shop, Hangar & Daily Reward ---

            updateUI() {
                document.getElementById('score').innerText = this.score;
                document.getElementById('distance').innerText = Math.floor(this.distance);
                document.getElementById('coins').innerText = this.coins;
                document.getElementById('healthBar').style.width = `${(this.player.health / this.player.maxHealth) * 100}%`;
            }

            returnToMenu() {
                 document.getElementById('gameOverScreen').classList.add('hidden');
                 document.getElementById('mainMenu').classList.remove('hidden');
            }

            openShop() {
                this.gameState = 'shop';
                document.getElementById('mainMenu').classList.add('hidden');
                document.getElementById('shopMenu').classList.remove('hidden');
                this.updateShopUI();
            }

            closeShop() {
                this.gameState = 'menu';
                document.getElementById('shopMenu').classList.add('hidden');
                document.getElementById('mainMenu').classList.remove('hidden');
            }

            updateShopUI() { /* ... unchanged, but uses new localStorage keys ... */ }
            buyUpgrade(type) { /* ... unchanged, but uses new localStorage keys ... */ }

            openHangar() {
                this.gameState = 'hangar';
                document.getElementById('mainMenu').classList.add('hidden');
                document.getElementById('hangarMenu').classList.remove('hidden');
            }

            closeHangar() {
                this.gameState = 'menu';
                document.getElementById('hangarMenu').classList.add('hidden');
                document.getElementById('mainMenu').classList.remove('hidden');
            }

            updateHangarUI() {
                const container = document.querySelector('#hangarMenu .hangar-grid');
                container.innerHTML = '';
                const bonusInfo = {
                    shield: { name: "START SHIELD", desc: "Begin with a 10s shield.", unlocked: this.startingBonuses.shield },
                    missile: { name: "START MISSILES", desc: "Begin with 3 homing missiles.", unlocked: this.startingBonuses.missile },
                    emp: { name: "START EMP", desc: "Begin with 1 EMP bomb.", unlocked: this.startingBonuses.emp }
                };

                for(const key in bonusInfo) {
                    const info = bonusInfo[key];
                    if (info.unlocked) {
                        const button = document.createElement('button');
                        button.className = 'menu-button';
                        if (this.selectedBonus === key) {
                            button.classList.add('selected');
                        }
                        button.innerText = info.name;
                        button.onclick = () => this.selectBonus(key);
                        container.appendChild(button);
                    }
                }
            }

            selectBonus(key) {
                this.selectedBonus = key;
                localStorage.setItem('SR_selectedBonus', key);
                this.updateHangarUI();
            }

            checkDailyReward() {
                const today = new Date().toDateString();
                const lastLogin = localStorage.getItem('SR_lastLogin');
                if (today !== lastLogin) {
                    document.getElementById('mainMenu').classList.add('hidden');
                    document.getElementById('dailyRewardModal').classList.remove('hidden');
                }
            }

            claimDailyReward() {
                const today = new Date().toDateString();
                localStorage.setItem('SR_lastLogin', today);
                this.totalCredits += 250;
                localStorage.setItem('SR_totalCredits', this.totalCredits);

                document.getElementById('dailyRewardModal').classList.add('hidden');
                document.getElementById('mainMenu').classList.remove('hidden');
                this.updateShopUI();
            }
        }

        // Stubs for functions that were removed for brevity but referenced in the logic
        SpaceRunner.prototype.checkCollision = function(r1, r2) { return r1.x < r2.x + r2.width && r1.x + r1.width > r2.x && r1.y < r2.y + r2.height && r1.y + r1.height > r2.y; };
        SpaceRunner.prototype.initStars = function() { /* ... */ };
        SpaceRunner.prototype.drawStars = function(speed) { /* ... */ };
        SpaceRunner.prototype.createExplosion = function(x, y, color, count) { /* ... */ };
        SpaceRunner.prototype.spawnAsteroid = function() {
            const size = 30 + Math.random() * 40;
            this.obstacles.push({
                x: this.width + size, y: Math.random() * (this.height - size),
                width: size, height: size, type: 'asteroid',
                rotation: 0, rotationSpeed: Math.random() * 0.05 - 0.025
            });
        };
        SpaceRunner.prototype.spawnEnemy = function() {
            const yPos = Math.random() * (this.height - 100) + 50;
            this.enemies.push({
                x: this.width + 50, y: yPos,
                width: 40, height: 30, type: 'kamikaze',
                health: 1 * this.difficultyLevel, maxHealth: 1 * this.difficultyLevel
            });
        };
        SpaceRunner.prototype.spawnCoinLine = function() {
            const y = Math.random() * (this.height - 200) + 100;
            for (let i = 0; i < 6; i++) {
                this.coinObjects.push({
                    x: this.width + 50 + i * 40, y: y + Math.sin(i * 0.8) * 40,
                    width: 20, height: 20, value: 1
                });
            }
        };

        const game = new SpaceRunner();
