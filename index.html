<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Space Runner — HTML5 Prototype</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Phaser 3 CDN (no build step) -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-container"></div>

  <!-- Mini control panel for quick debug/consent -->
  <div id="ui-overlay">
    <div id="consent">Consent: <button id="consent-btn">GIVE</button></div>
    <div id="debug">Debug: <button id="debug-btn">OFF</button></div>
  </div>

  <!-- Hidden form for leaderboard entry -->
  <div id="score-form" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #222; padding: 20px; border-radius: 10px; color: white;">
    <h3>Submit Score</h3>
    <input type="text" id="playerNameInput" placeholder="Enter your name" maxlength="10">
    <button id="submitScoreBtn">Submit</button>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
